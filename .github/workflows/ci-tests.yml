name: CI Tests

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  # Use the interpreter from setup-python; never download another one.
  # UV_PYTHON overrides the repo's .python-version (3.14, for local work) for
  # every uv command; jobs that set up a different Python override it.
  UV_PYTHON_DOWNLOADS: never
  UV_PYTHON: "3.12"

jobs:
  sensitive-data-gate:
    name: Sensitive Data Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and sync the locked environment
        run: |
          python -m pip install uv
          uv sync --locked

      - name: Run sensitive data gate
        run: uv run python scripts/hooks/pre-commit --remote-scan-only

  required-test:
    name: Python Test Gate (required, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: sensitive-data-gate
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv and sync the locked environment
        run: |
          python -m pip install uv
          uv sync --locked

      # Same tests as tests.test_runner, via pytest for per-test timings and skip
      # reasons (JUnit XML); scripts/compare_timings.py compares environments.
      - name: Run regression suite
        run: uv run python -m pytest -q -p no:cacheprovider --junitxml="timings/github-linux-py${{ matrix.python-version }}.xml"

      - name: Record timing metadata
        if: always()
        run: uv run python scripts/compare_timings.py meta --label "github-linux-py${{ matrix.python-version }}" --out "timings/github-linux-py${{ matrix.python-version }}.json" --extra "native checks"

      - name: Upload timing record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timings-github-linux-py${{ matrix.python-version }}
          path: timings/

  wheel-smoke-test:
    name: Built Wheel Smoke Test
    runs-on: ubuntu-latest
    needs: sensitive-data-gate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Build sdist and wheel
        run: uv build --out-dir "$RUNNER_TEMP/dist"

      - name: Wheel contains only the package
        run: |
          python - "$RUNNER_TEMP"/dist/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          stray = sorted({n.split("/")[0] for n in names
                          if not n.startswith(("kinetic_devops/", "kinetic_devops-"))})
          if stray:
              sys.exit(f"Unexpected top-level entries in the wheel: {stray}")
          print(f"{len(names)} files, all under kinetic_devops/")
          EOF

      - name: Install the wheel into a clean environment
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke" "$RUNNER_TEMP"/dist/*.whl

      # Run outside the checkout so nothing can be imported from the source tree.
      - name: Smoke-test the installed package
        working-directory: ${{ runner.temp }}
        run: |
          set -e
          BIN="$RUNNER_TEMP/smoke/bin"
          "$BIN/python" - <<'EOF'
          import importlib, pkgutil, kinetic_devops
          location = kinetic_devops.__file__
          assert "site-packages" in location, f"imported from {location}"
          modules = [m.name for m in pkgutil.walk_packages(kinetic_devops.__path__, "kinetic_devops.")]
          for name in modules:
              importlib.import_module(name)
          print(f"imported {len(modules)} modules from {location}")
          EOF
          "$BIN/kinetic-devops" --help > /dev/null
          "$BIN/repomaker" --help > /dev/null
          "$BIN/reposmith" --help > /dev/null
          "$BIN/repo-maker" --help > /dev/null
          "$BIN/python" -m kinetic_devops.auth --help > /dev/null
          "$BIN/python" -m kinetic_devops.efx_library --help > /dev/null
          echo "console scripts and module CLIs start"

  # GitHub only: Forgejo has no Windows runner. Real Windows with PowerShell 5.1,
  # for what the Linux jobs can't see: .exe launchers, env_init.ps1/.bat, the
  # hook installer, and Windows paths in the test suite.
  windows-test:
    name: Windows Test Gate (py3.12)
    runs-on: windows-latest
    needs: sensitive-data-gate

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pwsh here: Windows PowerShell 5.1 turns a native tool's stderr output
      # into a step failure. The smoke checks below run under 5.1 on purpose.
      - name: Install uv and sync the locked environment
        shell: pwsh
        run: |
          python -m pip install uv
          uv sync --locked

      - name: Run regression suite
        shell: pwsh
        run: uv run python -m pytest -q -p no:cacheprovider --junitxml="timings/github-windows-py3.12.xml"

      - name: Record timing metadata
        if: always()
        shell: pwsh
        run: uv run python scripts/compare_timings.py meta --label "github-windows-py3.12" --out "timings/github-windows-py3.12.json" --extra "native checks" --extra "windows smoke checks (separate step)"

      - name: Upload timing record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timings-github-windows-py3.12
          path: timings/

      - name: Windows smoke checks (Windows PowerShell 5.1)
        shell: powershell
        run: .\scripts\windows_smoke.ps1

  efx-syntax-check-tool-build:
    name: EFx Syntax Check Tool Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build syntax checker
        run: dotnet build tools/efx_syntax_check -c Release
