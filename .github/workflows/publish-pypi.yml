name: Publish Python package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test-gate:
    name: Require successful CI Tests run
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI Tests passed for tag commit
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner,
                repo,
                workflow_id: 'ci-tests.yml',
                per_page: 100
              }
            );

            const matching = runs.filter((run) => run.head_sha === sha);
            const success = matching.find((run) => run.conclusion === 'success');

            if (!success) {
              core.setFailed(
                `Release gate blocked: no successful CI Tests run found for commit ${sha}.` +
                ` Push the commit and wait for CI Tests to pass before tagging.`
              );
              return;
            }

            core.info(`Release gate passed via CI run #${success.run_number} (${success.html_url}).`);

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: test-gate
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-dist
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/p/kinetic-devops
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
