name: CI Tests

on:
  pull_request:
  # "Run workflow" button in the Actions tab (pick a branch); handy after runner or config changes
  workflow_dispatch:
  push:
    branches:
      - main
      - master

# Least privilege for the job token (restored 2026-11-02: the claim that Forgejo ignores this block is unverified).
permissions:
  contents: read

# Linux coverage on real distros, no Ubuntu: every job runs directly on a fresh VM of the distro in runs-on
# (the home runner's native labels: alpine = musl/OpenRC, fedora-coreos = rpm-ostree/SELinux, arch = rolling
# glibc). Every supported Python is tested on every distro (one VM per job; the distro is in the job name).
# Python comes from uv (managed builds, musl included): the setup-python action only has Ubuntu builds.
# UV_PYTHON overrides the repo's .python-version (3.14, for local work); jobs set their own.
env:
  UV_PYTHON_DOWNLOADS: automatic
  UV_PYTHON: "3.12"

jobs:
  sensitive-data-gate:
    name: Sensitive Data Gate
    runs-on: alpine

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: https://github.com/astral-sh/setup-uv@v6
        with:
          version: "0.13.5"

      - name: Sync the locked environment
        run: uv sync --locked

      - name: Run sensitive data gate
        run: uv run python scripts/hooks/pre-commit --remote-scan-only

  required-test:
    name: Python Test Gate (required, py${{ matrix.python-version }}, ${{ matrix.distro }})
    runs-on: ${{ matrix.distro }}
    needs: sensitive-data-gate
    strategy:
      fail-fast: false
      matrix:
        # Every supported Python (a test keeps branch protection equal to this list) on every host OS.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        distro: [alpine, fedora-coreos, arch]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: https://github.com/astral-sh/setup-uv@v6
        with:
          version: "0.13.5"

      - name: Sync the locked environment
        run: uv sync --locked

      # Same tests as tests.test_runner, via pytest for per-test timings and skip
      # reasons (JUnit XML); scripts/compare_timings.py compares environments.
      - name: Run regression suite
        run: uv run python -m pytest -q -p no:cacheprovider --junitxml="timings/forgejo-${{ matrix.distro }}-py${{ matrix.python-version }}.xml"

      - name: Record timing metadata
        if: always()
        run: uv run python scripts/compare_timings.py meta --label "forgejo-${{ matrix.distro }}-py${{ matrix.python-version }}" --out "timings/forgejo-${{ matrix.distro }}-py${{ matrix.python-version }}.json" --extra "native checks"

      - name: Upload timing record
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: timings-forgejo-${{ matrix.distro }}-py${{ matrix.python-version }}
          path: timings/

  wheel-smoke-test:
    name: Built Wheel Smoke Test
    runs-on: fedora-coreos
    needs: sensitive-data-gate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: https://github.com/astral-sh/setup-uv@v6
        with:
          version: "0.13.5"

      - name: Build sdist and wheel
        run: uv build --out-dir "$RUNNER_TEMP/dist"

      - name: Wheel contains only the package
        run: |
          uv run --no-project python - "$RUNNER_TEMP"/dist/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          stray = sorted({n.split("/")[0] for n in names
                          if not n.startswith(("kinetic_devops/", "kinetic_devops-"))})
          if stray:
              sys.exit(f"Unexpected top-level entries in the wheel: {stray}")
          print(f"{len(names)} files, all under kinetic_devops/")
          EOF

      - name: Install the wheel into a clean environment
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke" "$RUNNER_TEMP"/dist/*.whl

      # Run outside the checkout so nothing can be imported from the source tree.
      - name: Smoke-test the installed package
        working-directory: ${{ runner.temp }}
        run: |
          set -e
          BIN="$RUNNER_TEMP/smoke/bin"
          "$BIN/python" - <<'EOF'
          import importlib, pkgutil, kinetic_devops
          location = kinetic_devops.__file__
          assert "site-packages" in location, f"imported from {location}"
          modules = [m.name for m in pkgutil.walk_packages(kinetic_devops.__path__, "kinetic_devops.")]
          for name in modules:
              importlib.import_module(name)
          print(f"imported {len(modules)} modules from {location}")
          EOF
          "$BIN/kinetic-devops" --help > /dev/null
          "$BIN/repomaker" --help > /dev/null
          "$BIN/reposmith" --help > /dev/null
          "$BIN/repo-maker" --help > /dev/null
          "$BIN/python" -m kinetic_devops.auth --help > /dev/null
          "$BIN/python" -m kinetic_devops.efx_library --help > /dev/null
          echo "console scripts and module CLIs start"

  efx-syntax-check-tool-build:
    name: EFx Syntax Check Tool Build
    runs-on: arch
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"   # minimal VMs have no ICU; the build needs no culture data

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet   # native jobs run unprivileged: not /usr/share/dotnet
        with:
          dotnet-version: "9.0.x"

      - name: Build syntax checker
        run: dotnet build tools/efx_syntax_check -c Release
